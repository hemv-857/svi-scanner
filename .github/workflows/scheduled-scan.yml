name: scheduled-scan
on:
  schedule:
    - cron: "17 */6 * * *" # every 6h at :17 (avoid top-of-hour API rush)
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: Run scan cycle
        run: python -m sviscan.cli scan --currency BTC
      - name: Commit accumulated alerts
        run: |
          git config user.name "scanner-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/alerts.jsonl
          git diff --cached --quiet || git commit -m "scan: $(date -u +%FT%TZ) alerts=$(wc -l < data/alerts.jsonl 2>/dev/null || echo 0)"
          git pull --rebase origin ${GITHUB_REF_NAME} || true
          git push
